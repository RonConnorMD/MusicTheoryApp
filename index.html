<!doctype html>
<html>
  <head>
    <title>Music Theory App</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <h1>Music Theory App</h1>

    <h2>Root Note</h2>
    <div id="rootButtons"></div>

    <h2>Chord Type</h2>
    <div id="chordButtons"></div>

    <hr />

    <button id="lookupBtn">Lookup Chord</button>

    <h2>Result</h2>

    <div id="result"></div>

    <hr />

    <h2>Quiz Mode</h2>

    <button id="newQuestionBtn">New Question</button>

    <div id="quizQuestion"></div>
    <div id="quizStatus"></div>
    <div id="quizAnswer"></div>

    <h3>Selected Notes</h3>
    <div id="selectedNotes"></div>

    <div id="quizFeedback"></div>

    <h3>Available Notes</h3>
    <div id="quizNoteButtons"></div>

    <button id="checkAnswerBtn">Check Answer</button>

    <button id="clearAnswerBtn">Clear Answer</button>

    <div id="quizFeedback"></div>

    <script src="musicTheory.js"></script>
    <script src="app.js"></script>
  </body>
</html>
