<!doctype html>
<html>
  <head>
    <title>Music Theory App</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <h1>Music Theory App</h1>

    <h2>Root Note</h2>
    <div id="rootButtons"></div>

    <h2>Chord Type</h2>
    <div id="chordButtons"></div>

    <hr />

    <button id="lookupBtn">Lookup Chord</button>

    <h2>Result</h2>

    <div id="result"></div>

    <hr />

    <hr />

    <h2>Quiz Filters</h2>

    <div id="quizFilters">
      <div class="filter-group">
        <h3>
          <label>
            <input type="checkbox" id="triadsGroup" checked />
            All Triads
          </label>
        </h3>

        <div class="filter-options">
          <label
            ><input type="checkbox" class="triadChord" value="major" checked />
            Major</label
          ><br />
          <label
            ><input type="checkbox" class="triadChord" value="minor" checked />
            Minor</label
          ><br />
          <label
            ><input
              type="checkbox"
              class="triadChord"
              value="diminished"
              checked
            />
            Diminished</label
          ><br />
          <label
            ><input
              type="checkbox"
              class="triadChord"
              value="augmented"
              checked
            />
            Augmented</label
          >
        </div>
      </div>

      <div class="filter-group">
        <h3>
          <label>
            <input type="checkbox" id="suspendedGroup" checked />
            All Suspended/Add9
          </label>
        </h3>

        <div class="filter-options">
          <label
            ><input
              type="checkbox"
              class="suspendedChord"
              value="sus2"
              checked
            />
            Sus2</label
          ><br />
          <label
            ><input
              type="checkbox"
              class="suspendedChord"
              value="sus4"
              checked
            />
            Sus4</label
          ><br />
          <label
            ><input
              type="checkbox"
              class="suspendedChord"
              value="add9"
              checked
            />
            Add9</label
          >
        </div>
      </div>

      <div class="filter-group">
        <h3>
          <label>
            <input type="checkbox" id="seventhGroup" checked />
            All 7th Chords
          </label>
        </h3>

        <div class="filter-options">
          <label
            ><input
              type="checkbox"
              class="seventhChord"
              value="major7"
              checked
            />
            Maj7</label
          ><br />
          <label
            ><input
              type="checkbox"
              class="seventhChord"
              value="dominant7"
              checked
            />
            7</label
          ><br />
          <label
            ><input
              type="checkbox"
              class="seventhChord"
              value="minor7"
              checked
            />
            m7</label
          ><br />
          <label
            ><input
              type="checkbox"
              class="seventhChord"
              value="halfDiminished7"
              checked
            />
            ø7</label
          ><br />
          <label
            ><input
              type="checkbox"
              class="seventhChord"
              value="diminished7"
              checked
            />
            dim7</label
          >
        </div>
      </div>

      <div class="filter-group">
        <h3>
          <label>
            <input type="checkbox" id="ninthGroup" checked />
            All 9th Chords
          </label>
        </h3>

        <div class="filter-options">
          <label
            ><input type="checkbox" class="ninthChord" value="major9" checked />
            Maj9</label
          ><br />
          <label
            ><input
              type="checkbox"
              class="ninthChord"
              value="dominant9"
              checked
            />
            9</label
          ><br />
          <label
            ><input type="checkbox" class="ninthChord" value="minor9" checked />
            m9</label
          ><br />
          <label
            ><input
              type="checkbox"
              class="ninthChord"
              value="dominant7b9"
              checked
            />
            7♭9</label
          ><br />
          <label
            ><input
              type="checkbox"
              class="ninthChord"
              value="dominant7sharp9"
              checked
            />
            7♯9</label
          >
        </div>
      </div>
    </div>

    <h2>Quiz Mode</h2>

    <div id="scoreBoard">Score: 0 / 0</div>

    <button id="newQuestionBtn">New Question</button>

    <div id="quizQuestion"></div>
    <div id="quizStatus"></div>
    <div id="quizAnswer"></div>

    <h3>Selected Notes</h3>
    <div id="selectedNotes"></div>

    <div id="quizFeedback"></div>

    <h3>Available Notes</h3>
    <div id="quizNoteButtons"></div>

    <button id="checkAnswerBtn" disabled>Check Answer</button>

    <button id="clearAnswerBtn">Clear Answer</button>

    <div id="quizFeedback"></div>

    <script src="musicTheory.js"></script>
    <script src="app.js"></script>
  </body>
</html>
